name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Create .env for CI
        run: |
          echo "DATABASE_URL=postgresql://shortener_user:mysecretpassword@db:5432/shortener_db" > .env
          echo "API_KEY=ci-test-key" >> .env

      - name: Start the stack
        run: docker compose up -d --build

      - name: Show running containers
        run: docker compose ps

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T db pg_isready -U shortener_user && break
            sleep 2
          done

      - name: Create test database
        run: docker compose exec -T db psql -U shortener_user -d shortener_db -c "CREATE DATABASE shortener_test_db;"
